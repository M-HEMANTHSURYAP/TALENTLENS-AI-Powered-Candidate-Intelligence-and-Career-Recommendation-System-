<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TALENTLENS | Profile Analysis</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
        }

        .container {
            max-width: 750px;
            margin: 60px auto;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
        }

        .subtitle {
            text-align: center;
            color: #aeb7d0;
            margin-bottom: 35px;
        }

        .card {
            background: #151c32;
            padding: 35px;
            border-radius: 20px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: none;
            background: #242d48;
            color: white;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #0b1020;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            transform: scale(1.01);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TALENTLENS</h1>

    <p class="subtitle">
        Build your candidate intelligence profile
    </p>

    <div class="card">

        <form method="POST">

            <label>Your Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
            >

            <label>Target Job Role</label>

            <select name="target_role" required>
                <option value="">Select your target role</option>
                <option value="Software Developer">Software Developer</option>
                <option value="Python Developer">Python Developer</option>
                <option value="Java Developer">Java Developer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="AI/ML Engineer">AI/ML Engineer</option>
                <option value="Full Stack Developer">Full Stack Developer</option>
                <option value="Cybersecurity Analyst">Cybersecurity Analyst</option>
            </select>

            <label>Your Current Skills</label>

            <textarea
                name="skills"
                placeholder="Example: Python, Java, SQL, HTML, CSS, Flask, Git"
                required
            ></textarea>

            <button class="submit-btn" type="submit">
                ANALYZE MY PROFILE
            </button>

        </form>

    </div>

</div>

</body>

</html>
